<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login Authorization</title>
    <style>
        /* Example CSS styling */
        body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #fff; border: 1px solid #ddd; padding: 20px; }
        .button {
            display: inline-block;
            padding: 10px 20px;
            color: #fff;
            background: #007BFF;
            text-decoration: none;
            border-radius: 5px;
        }
        .footer { margin-top: 20px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        {% if is_staging %}
        <p style="margin:0 0 12px;padding:8px;background:#fff3cd;color:#664d03;font-weight:bold">AMBIENTE DE TESTE — STAGING</p>
        {% endif %}
        {% if logo_url %}
        <p style="margin:0 0 16px"><img src="{{ logo_url }}" alt="DW Corp" width="180" style="display:block;width:180px;max-width:100%;height:auto;margin:0 auto;border:0" /></p>
        {% else %}
        <p style="margin:0 0 16px;font-weight:bold;color:#0D5580">DW Corp</p>
        {% endif %}
        <h2>Olá {{ username }},</h2>
        <p>Se você requisitou logar em uma das nossas aplicações, por favor clique no link abaixo:</p>
        <p>
            <a class="button" href="{{ magic_link }}">Autorizar!</a>
        </p>
        <p class="footer">
            Muito obrigado por usar nossa aplicação!
        </p>
    </div>
</body>
</html>
